[workspace]
members = ["crates/measurement-core", "crates/sentinel-server"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Hyperclaw79/hypernet-sentinel"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1"
humantime-serde = "1"
if-addrs = "0.10"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "gzip", "brotli", "deflate", "json", "stream", "socks"] }
rmcp = { version = "3.0.0", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset", "serde"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "fs"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
pnet_packet = "0.35"
