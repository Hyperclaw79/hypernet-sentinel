services:
  hypernet-sentinel:
    image: ghcr.io/hyperclaw79/hypernet-sentinel:latest
    container_name: hypernet-sentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SENTINEL_QUALITY_INTERVAL_SECONDS: "3600"
      SENTINEL_FULL_INTERVAL_SECONDS: "14400"
      SENTINEL_DOWNLOAD_SECONDS: "10"
      SENTINEL_UPLOAD_SECONDS: "10"
      SENTINEL_LATENCY_SECONDS: "2"
      SENTINEL_UDP_PACKETS: "50"
      SENTINEL_RUN_TIMEOUT_SECONDS: "90"
      SENTINEL_RETENTION_DAYS: "90"
    volumes:
      - sentinel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - com.getarcaneapp.arcane.updater=true

volumes:
  sentinel-data:
