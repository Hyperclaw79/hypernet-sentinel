name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: hypernet-sentinel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  testing:
    name: Required / Testing
    uses: ./.github/workflows/testing.yml

  image:
    name: Required / OCI build
    needs:
      - testing
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/sentinel-server/Cargo.toml | head -n1)"
          test -n "$version"
          upstream_revision="$(tr -d '\r\n' < crates/measurement-core/UPSTREAM_REVISION)"
          test -n "$upstream_revision"
          {
            echo "version=$version"
            echo "short_sha=${GITHUB_SHA:0:12}"
            echo "source_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "upstream_revision=$upstream_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build immutable candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          cache-from: type=gha,scope=hypernet-sentinel-image
          cache-to: type=gha,mode=max,scope=hypernet-sentinel-image
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
            SOURCE_URL=${{ steps.metadata.outputs.source_url }}
            UPSTREAM_REVISION=${{ steps.metadata.outputs.upstream_revision }}
          tags: hypernet-sentinel:ci-${{ steps.metadata.outputs.short_sha }}

      - name: Smoke-test immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          container=hypernet-sentinel-ci
          volume=hypernet-sentinel-ci-data
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" --read-only --tmpfs /tmp --cap-drop ALL \
            -e SENTINEL_SCHEDULER_ENABLED=false -v "$volume:/data" -p 18080:8080 \
            "hypernet-sentinel:ci-${{ steps.metadata.outputs.short_sha }}" >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs "$container"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/ | grep -q "Run all tests"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container")" != unhealthy

      - name: Assemble immutable handoff
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact/release
          docker save "hypernet-sentinel:ci-${{ steps.metadata.outputs.short_sha }}" | gzip -n > dist/artifact/release/image.tar.gz
          cat > dist/artifact/BUILD-METADATA <<EOF
          commit=$GITHUB_SHA
          version=${{ steps.metadata.outputs.version }}
          upstream_revision=${{ steps.metadata.outputs.upstream_revision }}
          artifact_profile=oci-image
          source=${{ steps.metadata.outputs.source_url }}
          EOF
          (cd dist/artifact && sha256sum BUILD-METADATA release/image.tar.gz > SHA256SUMS)

      - name: Upload immutable handoff
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypernet-sentinel-${{ github.sha }}
          path: dist/artifact
          if-no-files-found: error
          retention-days: 7

  publish-immutable:
    name: Required / Publish immutable image
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs:
      - image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download immutable handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hypernet-sentinel-${{ github.sha }}
          path: dist/artifact

      - name: Verify immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "commit=$GITHUB_SHA" dist/artifact/BUILD-METADATA
          (cd dist/artifact && sha256sum -c SHA256SUMS)
          gunzip -c dist/artifact/release/image.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or reuse immutable commit image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$image_base:sha-$GITHUB_SHA"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Immutable image already exists; preserving the first publication."
            docker pull "$image"
          else
            local_image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^hypernet-sentinel:ci-' | head -n1)"
            test -n "$local_image"
            docker tag "$local_image" "$image"
            docker push "$image"
            docker pull "$image"
          fi
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          expected_upstream="$(sed -n 's/^upstream_revision=//p' dist/artifact/BUILD-METADATA)"
          test -n "$expected_upstream"
          test "$(docker image inspect --format '{{index .Config.Labels "io.hypernet-sentinel.upstream-revision"}}' "$image")" = "$expected_upstream"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          {
            echo "image_base=$image_base"
            echo "digest=${digest_ref#*@}"
            echo "upstream_revision=$expected_upstream"
          } >> "$GITHUB_OUTPUT"

      - name: Attest immutable image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.image_base }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-version: sha-${{ github.sha }}
          push-to-registry: true

      - name: Record published image identity
        shell: bash
        run: |
          {
            echo "## Published immutable image"
            echo
            echo "- Image: \`${{ steps.publish.outputs.image_base }}@${{ steps.publish.outputs.digest }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Upstream revision: \`${{ steps.publish.outputs.upstream_revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
